name: Post Magic Card of the Day

on:
  schedule:
    # 10am Mountain Time daily. GitHub Actions cron runs in fixed UTC and
    # doesn't observe DST, so two rules approximate the wall-clock time:
    # MDT (UTC-6) for Mar-Oct, MST (UTC-7) for Nov-Feb. Off by an hour during
    # the ~1-week DST transition itself (early Mar / early Nov).
    - cron: "0 16 * 3-10 *"
    - cron: "0 17 * 11,12,1,2 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post card of the day
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python post_card_of_the_day.py

      - name: Commit updated posted-cards log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_cards.json
          git diff --cached --quiet || git commit -m "Update posted cards log"
          git push
