name: Post Magic Card of the Day

on:
  # Triggered daily by an external cron-job.org job calling the GitHub REST
  # API's workflow_dispatch endpoint (see README.md for setup). No native
  # `schedule:` trigger here on purpose, to avoid double-firing.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post card of the day
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python post_card_of_the_day.py

      - name: Commit updated posted-cards log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_cards.json
          git diff --cached --quiet || git commit -m "Update posted cards log"
          git push
